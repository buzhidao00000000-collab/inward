<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-visual">
<title>INWARD · Dialogue</title>
<style>
body{margin:0}
@media(pointer:coarse){
 #inward-preview.iw-editing .iw-bottom nav,
 #inward-preview.iw-editing .iw-home-indicator{display:none}
 #inward-preview.iw-editing .iw-bottom{padding-bottom:16px;margin-bottom:var(--iw-keyboard-inset,0px)}
}
</style>
<style>
/* The supplied artwork fills the device only while Meditate is visible. */
#inward-preview .iw-meditate-background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;z-index:0;display:none}
#inward-preview.iw-show-relax[data-relax-mode=meditate] .iw-meditate-background{display:block}
#inward-preview.iw-show-relax[data-relax-mode=meditate] .iw-background-motion{visibility:hidden}
#inward-preview.iw-show-relax[data-relax-mode=meditate] .iw-status,
#inward-preview.iw-show-relax[data-relax-mode=meditate] h1{color:#fff}
#inward-preview.iw-show-relax[data-relax-mode=meditate] .iw-meditate-placeholder h2{color:#fff;text-shadow:0 2px 12px #17102b80}
#inward-preview.iw-show-relax[data-relax-mode=meditate] .iw-meditate-placeholder p{color:#e6dff7;text-shadow:0 1px 8px #17102b80}
</style>
<style>
/* Softer glass edges over the dark Meditate artwork. */
#inward-preview.iw-show-relax[data-relax-mode=meditate] nav.iw-glass-nav{box-shadow:0 4px 16px #100b2520}
#inward-preview.iw-show-relax[data-relax-mode=meditate] nav.iw-glass-nav::before{background:linear-gradient(145deg,#ffffff14,#f5f1fb08 55%,#e8e1f510)}
#inward-preview.iw-show-relax[data-relax-mode=meditate] .iw-nav-frame{visibility:hidden}
#inward-preview.iw-show-relax[data-relax-mode=meditate] .iw-nav-reflection{opacity:.12}
#inward-preview.iw-show-relax[data-relax-mode=meditate] .iw-nav-selection{background-color:#d9cfed38;box-shadow:inset 0 1px 2px #ffffff18,0 2px 8px #100b251a}
#inward-preview.iw-show-relax[data-relax-mode=meditate] .iw-nav-selection::before{opacity:.12}
#inward-preview.iw-show-relax[data-relax-mode=meditate] .iw-nav-selection::after{opacity:.35}
#inward-preview.iw-show-relax[data-relax-mode=meditate] .iw-relax-mode-switch::before{box-shadow:inset 0 1px 1px #ffffff14,0 2px 8px #100b2510}
#inward-preview.iw-show-relax[data-relax-mode=meditate] .iw-tools button::before{border-color:transparent;box-shadow:inset 0 1px 2px #ffffff1a,0 2px 8px #100b2520}
</style>
<style>
/* Preserve the supplied SVG artwork; recolor inactive tabs over the night scene. */
#inward-preview.iw-show-relax[data-relax-mode=meditate] nav.iw-glass-nav button:not([data-tab=relax]){color:#a8a8a8}
</style>
<style>
/* Keep the selected mode translucent over the scenery. */
#inward-preview.iw-show-relax[data-relax-mode=meditate] .iw-relax-mode-switch .iw-nav-selection{background-color:#f5f0fc38;z-index:1}
</style>
<style>
#inward-preview .iw-meditate-controls{position:absolute;left:22px;top:210px;z-index:2;display:none;flex-direction:column;gap:22px}
#inward-preview.iw-show-relax[data-relax-mode=meditate] .iw-meditate-controls{display:flex}
#inward-preview .iw-meditate-controls button{display:grid;place-items:center;width:44px;height:44px;min-height:44px;padding:1px;border:0;border-radius:14px;background:transparent;box-shadow:none;touch-action:manipulation}
#inward-preview .iw-meditate-controls img{display:block;width:42px;height:42px;pointer-events:none}
#inward-preview .iw-meditate-controls img[src$="scenery-button.svg"]{height:40px}
#inward-preview .iw-meditate-controls button:focus-visible{outline:2px solid #d3c0ff;outline-offset:3px}
</style>
<style>
#inward-preview .iw-meditate-view{position:relative}
#inward-preview .iw-meditate-scene{position:relative;width:288px;max-width:100%;height:426px;transform:translateY(5px)}
#inward-preview .iw-meditate-view .iw-meditate-placeholder{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}
#inward-preview .iw-meditate-start{position:absolute;left:50px;top:375px;display:block;width:188px;height:45px;min-height:0;padding:0;border:0;border-radius:999px;background:transparent;box-shadow:none;touch-action:manipulation}
#inward-preview .iw-meditate-start img{display:block;width:188px;height:45px;pointer-events:none}
#inward-preview .iw-meditate-start:focus-visible{outline:2px solid #d3c0ff;outline-offset:3px}
</style>
<style>
#inward-preview .iw-scene-picker{position:absolute;left:72px;top:160px;width:290px;height:470px;z-index:5;touch-action:none;user-select:none;-webkit-user-select:none;perspective:800px;overflow:visible;outline:none;overscroll-behavior:contain}
#inward-preview .iw-scene-card{position:absolute;left:0;top:0;width:178px;height:100px;min-height:0;padding:0;border:0;border-radius:17px;overflow:hidden;background:#241a40;box-shadow:0 8px 24px #09051455;transform-origin:center;will-change:transform,opacity;transition:none;touch-action:none}
#inward-preview .iw-scene-card img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
#inward-preview .iw-scene-card[aria-pressed=true]{box-shadow:0 0 0 1.5px #e7dfffaa,0 10px 28px #09051466}
#inward-preview .iw-scene-card:focus-visible{outline:2px solid #eadfff;outline-offset:4px}
#inward-preview .iw-scene-picker-status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
#inward-preview .iw-meditate-background{transition:opacity .65s ease}
#inward-preview.iw-scene-picker-open .iw-meditate-placeholder{opacity:0}
#inward-preview .iw-meditate-placeholder{transition:opacity .2s ease}
@media(prefers-reduced-motion:reduce){#inward-preview .iw-meditate-background{transition-duration:.12s}}

</style>
<style>
#inward-preview .iw-media-card-caption{position:absolute;inset:auto 0 0;padding:14px 10px 8px;color:#fff;background:linear-gradient(transparent,#0b0714bb);font-size:13px;line-height:18px;text-align:left;text-shadow:0 1px 3px #0008;pointer-events:none}
#inward-preview.iw-sound-selected .iw-meditate-placeholder{display:none}

</style>
<style>
#inward-preview .iw-duration-overlay{position:absolute;inset:0;z-index:30;display:flex;align-items:flex-end;background:#20162c00;transition:background .26s ease;border-radius:inherit;overflow:hidden}
#inward-preview .iw-duration-overlay[hidden]{display:none}
#inward-preview .iw-duration-overlay.is-open{background:#20162c14}
#inward-preview .iw-duration-sheet{--duration-accent:var(--iw-send,#805fe3);box-sizing:border-box;position:relative;width:calc(100% - 16px);max-height:calc(100% - 24px);overflow-y:auto;margin:0 8px 12px;padding:12px 24px 23px;border:0;border-radius:32px;background:none;isolation:isolate;box-shadow:inset 0 1px 1px #ffffff99,inset 0 -1px 2px #b9b4c314,0 4px 14px #7463860a;text-align:center;color:#332b3b;transform:translateY(calc(100% + 24px));transition:transform .32s cubic-bezier(.22,1.35,.36,1);font-family:inherit}
/* Same surface, blur and edge reflection as the navigation bar. */
#inward-preview .iw-duration-sheet::before{content:"";position:absolute;inset:0;z-index:0;border-radius:inherit;clip-path:inset(0 round 32px);background:linear-gradient(145deg,#ffffff59,#f5f1fb1f 55%,#e8e1f533);backdrop-filter:blur(22px) saturate(165%);-webkit-backdrop-filter:blur(22px) saturate(165%);pointer-events:none}
#inward-preview .iw-duration-sheet::after{content:"";position:absolute;inset:0;z-index:2;padding:1px;border-radius:inherit;pointer-events:none;background:linear-gradient(120deg,#ffffff0a 4%,#ffffffcc 30%,#ffffff33 54%,#b7a6cc26 74%,#ffffff14 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.85}
#inward-preview .iw-duration-sheet>:not(.iw-duration-close){position:relative;z-index:1}
#inward-preview .iw-duration-sheet>.iw-duration-close{z-index:3}
#inward-preview .is-open .iw-duration-sheet{transform:translateY(0)}
#inward-preview .iw-duration-handle{display:grid;place-items:center;width:88px;height:44px;min-height:44px;padding:0;border:0;background:transparent;box-shadow:none;margin:-8px auto -7px;touch-action:none;cursor:grab}
#inward-preview .iw-duration-handle::after{content:"";display:block;width:32px;height:4px;border-radius:4px;background:#ffffffc9;margin:auto}
#inward-preview .iw-duration-sheet.is-sheet-dragging{transition:none;cursor:grabbing}
#inward-preview .iw-duration-sheet.is-sheet-dragging .iw-duration-handle{cursor:grabbing}
#inward-preview .iw-duration-overlay:not(.is-open) .iw-duration-sheet{transition:transform .26s ease-in}
#inward-preview .iw-duration-close{position:absolute;right:9px;top:19px;display:grid;place-items:center;width:44px;height:44px;min-height:44px;padding:0;border:0;border-radius:50%;font-size:26px;font-weight:300;line-height:1;color:#62566e;background:transparent;box-shadow:none}
#inward-preview .iw-duration-sheet h2{font-size:15px;font-weight:500;letter-spacing:-.2px;line-height:24px;margin:0 24px 16px;color:#62566e}
#inward-preview .iw-duration-readout{display:flex;align-items:baseline;justify-content:center;gap:7px;height:72px;margin:0 0 12px;font-variant-numeric:tabular-nums}
#inward-preview .iw-duration-number{display:inline-block;min-width:1.5ch;font-size:56px;line-height:68px;font-weight:500;letter-spacing:-2px}
#inward-preview .iw-duration-unit{font-size:19px;font-weight:400;color:#62566e}
#inward-preview .iw-duration-number.is-changing{animation:iw-duration-digit .16s ease-out}
@keyframes iw-duration-digit{from{transform:translateY(var(--digit-shift,5px));filter:blur(1px);opacity:.7}to{transform:translateY(0);filter:blur(0);opacity:1}}
#inward-preview .iw-duration-ruler{position:relative;width:100%;height:84px;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;outline-offset:3px;mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 16%,#000 84%,transparent)}
#inward-preview .is-dragging .iw-duration-ruler{cursor:grabbing}
#inward-preview .iw-duration-ticks{position:absolute;left:50%;top:14px;width:1428px;height:52px;will-change:transform}
#inward-preview .iw-duration-tick{position:absolute;top:calc(24px - var(--tick-height,6px)/2);display:block;width:1px;height:var(--tick-height,6px);border-radius:1px;background:#77688470}
#inward-preview .iw-duration-tick.is-major{background:#62566e99}
#inward-preview .iw-duration-tick>span{position:absolute;left:50%;top:calc(28px + var(--tick-height,6px)/2);transform:translateX(-50%);font-size:10px;line-height:14px;color:#62566e}
#inward-preview .iw-duration-pointer{position:absolute;left:calc(50% - 1px);top:12px;width:2px;height:52px;border-radius:2px;background:var(--duration-accent);box-shadow:0 0 0 3px #f9f6fc66;pointer-events:none;transition:height .18s ease,top .18s ease}
#inward-preview .is-dragging .iw-duration-pointer{height:56px;top:10px}
#inward-preview .iw-duration-limits{display:flex;justify-content:space-between;font-size:11px;line-height:16px;color:#62566e;margin:5px 0 24px}
#inward-preview .iw-duration-confirm{width:100%;height:48px;min-height:48px;padding:0 16px;border:1px solid #ffffff80;border-radius:24px;background:#eeedf338;color:inherit;backdrop-filter:blur(15px) saturate(165%);-webkit-backdrop-filter:blur(15px) saturate(165%);font-size:15px;font-weight:500;box-shadow:inset 0 1px 1px #ffffff52}
#inward-preview .iw-duration-sheet button:focus-visible,#inward-preview .iw-duration-ruler:focus-visible{outline:2px solid #514067;outline-offset:3px}
#inward-preview.iw-show-relax[data-relax-mode=meditate] .iw-duration-sheet{color:#fff;text-shadow:0 1px 4px #100b2580;box-shadow:inset 0 1px 1px #ffffff99,inset 0 -1px 2px #b9b4c314,0 4px 16px #100b2520}
#inward-preview.iw-show-relax[data-relax-mode=meditate] .iw-duration-sheet::before{background:linear-gradient(145deg,#ffffff14,#f5f1fb08 55%,#e8e1f510)}
#inward-preview.iw-show-relax[data-relax-mode=meditate] .iw-duration-sheet h2,#inward-preview.iw-show-relax[data-relax-mode=meditate] .iw-duration-close,#inward-preview.iw-show-relax[data-relax-mode=meditate] .iw-duration-unit,#inward-preview.iw-show-relax[data-relax-mode=meditate] .iw-duration-limits,#inward-preview.iw-show-relax[data-relax-mode=meditate] .iw-duration-tick>span{color:#f5f1fb}
#inward-preview.iw-show-relax[data-relax-mode=meditate] .iw-duration-tick{background:#ffffff70}
#inward-preview.iw-show-relax[data-relax-mode=meditate] .iw-duration-tick.is-major{background:#ffffffb3}
#inward-preview.iw-show-relax[data-relax-mode=meditate] .iw-duration-pointer{background:#d9c2ff;box-shadow:0 0 0 2px #ffffff14}
#inward-preview.iw-show-relax[data-relax-mode=meditate] .iw-duration-sheet button:focus-visible,#inward-preview.iw-show-relax[data-relax-mode=meditate] .iw-duration-ruler:focus-visible{outline-color:#eadfff}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){#inward-preview .iw-duration-sheet::before{background:#f5f2f9f5}#inward-preview.iw-show-relax[data-relax-mode=meditate] .iw-duration-sheet::before{background:#30283df5}}
@media(prefers-reduced-motion:reduce){#inward-preview .iw-duration-sheet,#inward-preview .iw-duration-overlay,#inward-preview .iw-duration-pointer{transition-duration:.01s}#inward-preview .iw-duration-number.is-changing{animation:none}}
</style>

<style>
#inward-preview{padding:28px 12px 32px;display:flex;justify-content:center}
#inward-preview *{box-sizing:border-box}
#inward-preview [hidden]{display:none!important}
#inward-preview .iw-phone{--iw-send:#805FE3;--iw-active:#B37FFF;position:relative;width:390px;max-width:100%;background:radial-gradient(ellipse 180px 155px at 12% 87%,#e8e6f380,transparent),radial-gradient(ellipse 190px 150px at 95% 86%,#e8f2ee80,transparent),#fafafd;color:#242329;border:7px solid #eae9ef;border-radius:48px;box-shadow:0 24px 70px #4e3b7820,0 2px 5px #37254b0c;overflow:hidden;font-family:var(--iw-font);font-size:17px;font-weight:500;font-synthesis:none;letter-spacing:-.3px}
#inward-preview button,#inward-preview input{font-family:inherit;font-size:17px;font-weight:500;letter-spacing:-.3px;line-height:22px;color:inherit}
#inward-preview button{cursor:pointer;border:0}
#inward-preview button,#inward-preview input{-webkit-tap-highlight-color:transparent;outline:none}
#inward-preview button:focus,#inward-preview input:focus{outline:none}
#inward-preview button:focus-visible{outline:2px solid #B37FFF;outline-offset:3px}
#inward-preview input:focus-visible{outline:none}
#inward-preview[data-input-method=keyboard] .iw-input:focus-within{outline:2px solid #B37FFF;outline-offset:3px}
#inward-preview .iw-status{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 25px;font-size:15px;line-height:20px;font-weight:600;position:relative;letter-spacing:0}
#inward-preview .iw-island{position:absolute;width:99px;height:26px;background:#242328;border-radius:20px;left:50%;transform:translateX(-50%);top:9px}
#inward-preview header{padding:24px 20px 0;display:flex;align-items:center;justify-content:space-between}
#inward-preview h1{font-family:inherit;font-size:34px;line-height:41px;letter-spacing:-.8px;font-weight:700;margin:0}
#inward-preview .iw-dot,#inward-preview .iw-eyes,#inward-preview .iw-welcome>p,#inward-preview .iw-hint,#inward-preview .iw-demo,#inward-preview small:empty,#inward-preview .iw-sheet-note:empty{display:none}
#inward-preview .iw-tools{display:flex;gap:9px}
#inward-preview .iw-tools button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#736b7e}
#inward-preview .iw-tools .iw-avatar{font-size:17px;font-weight:500;color:#8a6bb2;background:radial-gradient(circle at 30% 15%,#fff9,transparent 65%),#eae0f380}
#inward-preview .iw-icon{display:block;width:24px;height:24px;object-fit:contain;flex-shrink:0}
#inward-preview .iw-tools .iw-icon{width:22px;height:22px}
#inward-preview main{position:relative;min-height:455px;padding:82px 20px 28px;background:radial-gradient(ellipse at 96% 62%,#eee6fa60,transparent 59%),radial-gradient(ellipse at 0% 82%,#faf0e660,transparent 60%)}
#inward-preview h2{font-family:inherit;font-size:28px;line-height:34px;font-weight:600;letter-spacing:-.55px;margin:0 0 28px}
#inward-preview .iw-options{display:flex;flex-direction:column;gap:12px}
#inward-preview .iw-options button{display:flex;align-items:center;text-align:left;gap:12px;font-size:17px;line-height:22px;padding:14px 12px;min-height:66px;border-radius:21px;color:#726B7E;font-weight:400;transition:transform .18s}
#inward-preview .iw-options button:hover{transform:translateY(-1px)}
#inward-preview .iw-options button>.iw-icon{display:none}
#inward-preview .iw-seed{width:32px;height:36px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
#inward-preview .iw-seed .iw-icon{width:19px;height:19px}
#inward-preview .peach{background:#f5e4d880}
#inward-preview .lime{background:#e8eed880}
#inward-preview .lavender{background:#e9def780}
#inward-preview .iw-bottom{padding:16px 15px 0;position:relative;background:transparent}
#inward-preview .iw-composer{display:flex;gap:10px;align-items:center;padding:0 3px}
#inward-preview .iw-input{display:flex;align-items:center;border-radius:27px;padding:3px;flex:1;min-width:0;min-height:54px}
#inward-preview input{width:100%;min-width:0;border:0;background:transparent;padding:10px 5px;font-size:17px;line-height:22px;outline-offset:1px}
#inward-preview input::placeholder{color:#8f889a}
#inward-preview .iw-cloud-button{width:42px;height:44px;flex-shrink:0;background:transparent;display:grid;place-items:center}
#inward-preview .iw-cloud{width:29px;height:27px;background:radial-gradient(circle at 32% 27%,#f7f0ff,#c9acee 60%,#a782dc);border-radius:47% 61% 43% 58% / 59% 43% 60% 42%;position:relative;animation:iw-drift 6s ease-in-out infinite;box-shadow:inset -2px -3px 5px #9267c52c,0 3px 9px #b89ada33}
#inward-preview .iw-cloud:before,#inward-preview .iw-cloud:after{content:"";position:absolute;background:inherit;border-radius:50%;width:15px;height:17px;top:1px;left:-4px}
#inward-preview .iw-cloud:after{left:auto;right:-3px;top:7px;width:14px;height:16px}
#inward-preview .iw-cloud span{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff9;z-index:1;top:7px;left:8px}
#inward-preview .iw-send{color:#fff;min-width:77px;height:54px;border-radius:27px;display:grid;place-items:center;font-size:17px;font-weight:600;padding:0 15px;flex-shrink:0;background:linear-gradient(155deg,#ffffff25,transparent 48%),var(--iw-send);border:1px solid #ffffff70;box-shadow:inset 0 1px 1px #ffffffb0,inset 0 -2px 3px #4b279a24,0 0 0 .5px #7657bb38,0 5px 12px #805fe325}
#inward-preview nav{margin-top:20px;display:flex;padding:6px;border-radius:32px}
#inward-preview nav button{width:25%;background:transparent;color:#77717e;display:flex;flex-direction:column;align-items:center;gap:5px;min-height:58px;justify-content:center;border-radius:27px}
#inward-preview nav span{font-size:13px;line-height:18px;font-weight:500;letter-spacing:0}
#inward-preview nav .iw-active{color:var(--iw-active);background:linear-gradient(145deg,#ffffff90,#e5dfed70);box-shadow:inset 0 1px 2px #fff,inset 0 -1px 3px #7d6b9c0b,0 1px 5px #7761840a}

const modeSwitch=root.querySelector('.iw-relax-mode-switch');
const modeButtons=Array.from(modeSwitch.querySelectorAll('[data-relax-mode]'));
let relaxMode='breathe';root.dataset.relaxMode=relaxMode;
function setRelaxMode(mode){
 if(!['breathe','meditate'].includes(mode))return;
 close();relaxMode=mode;root.dataset.relaxMode=mode;
 const visible=root.classList.contains('iw-show-relax');
 relaxView.hidden=!visible||mode!=='breathe';
 meditateView.hidden=!visible||mode!=='meditate';
 modeButtons.forEach(button=>{const active=button.dataset.relaxMode===mode;button.classList.toggle('iw-mode-active',active);button.setAttribute('aria-selected',String(active));button.tabIndex=active?0:-1});
 if(mode==='meditate')window.InwardBreathing?.end();
 document.dispatchEvent(new CustomEvent('inward:relaxmodechange',{detail:{mode}}));
}
modeButtons.forEach(button=>button.addEventListener('click',()=>setRelaxMode(button.dataset.relaxMode)));
modeSwitch.addEventListener('keydown',event=>{
 if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
 event.preventDefault();const mode=(event.key==='ArrowLeft'||event.key==='Home')?'breathe':'meditate';
 setRelaxMode(mode);modeButtons.find(button=>button.dataset.relaxMode===mode).focus();
});

function setMainTab(tab){
 close();
 const relaxing=tab==='relax',dialogue=tab==='dialogue';
 root.classList.toggle('iw-show-relax',relaxing);
 root.classList.toggle('iw-secondary-tab',!dialogue);
 relaxView.hidden=!relaxing||relaxMode!=='breathe';
 meditateView.hidden=!relaxing||relaxMode!=='meditate';
 modeSwitch.hidden=!relaxing;
 root.querySelector('[data-action="history"]').hidden=relaxing;
 placeholderView.hidden=dialogue||relaxing;
 placeholderView.setAttribute('aria-label',tab==='report'?'Report':'Me');
 welcome.hidden=!dialogue||sent.length>0;
 messages.hidden=!dialogue;
 root.querySelector('.iw-composer').hidden=!dialogue;
 root.querySelector('.iw-quick-actions').hidden=!dialogue;
 root.querySelector('h1').hidden=relaxing;
 root.querySelector('h1').firstChild.textContent={dialogue:'Dialogue',relax:'',report:'Report',me:'Me'}[tab];
 root.querySelectorAll('[data-tab]').forEach(button=>{
  const selected=button.dataset.tab===tab;
  button.classList.toggle('iw-active',selected);
  if(selected)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');
 });
 document.dispatchEvent(new CustomEvent('inward:tabchange',{detail:{tab}}));
}

  if(rest===text||rest.startsWith(text+' ')){

async function makePhotoPreview(file,image){
 if(file.size<=512*1024)return file;
 const ratio=Math.min(1,1024/image.naturalWidth,1024/image.naturalHeight);
 const width=Math.max(1,Math.round(image.naturalWidth*ratio)),height=Math.max(1,Math.round(image.naturalHeight*ratio));

 canvas.getContext('2d').drawImage(image,0,0,width,height);
 const type=file.type==='image/jpeg'?'image/jpeg':'image/webp';
 const blob=await new Promise(resolve=>canvas.toBlob(resolve,type,.82));
 return blob&&blob.size<file.size?blob:file;
}
photoInput.addEventListener('change',async()=>{

 if(!file.type.startsWith('image/')){photoInput.value='';return}
 if(selectedPhoto)releasePhoto(selectedPhoto);
 const originalUrl=URL.createObjectURL(file);
 const photo={url:originalUrl,originalUrl,name:file.name};
 selectedPhoto=photo;
 attachmentImage.removeAttribute('src');
 attachmentImage.alt=file.name;
 attachmentRow.hidden=false;
 attachmentRow.classList.add('iw-photo-loading');
 attachmentRow.setAttribute('aria-busy','true');
 inputShell.classList.add('iw-has-photo');
 // Display first; do not block the first preview on resizing or encoding.
 attachmentImage.src=photo.url;
 if(file.size<=512*1024)return;
 try{
  await attachmentImage.decode();
  if(selectedPhoto!==photo)return;
  // Paint the original photo first, then wait for idle time before compression.
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  await new Promise(resolve=>{
   if(typeof requestIdleCallback==='function')requestIdleCallback(resolve,{timeout:1500});
   else setTimeout(resolve,250);
  });
  if(selectedPhoto!==photo)return;
  const preview=await makePhotoPreview(file,attachmentImage);
  // A removed, replaced or sent photo must not reappear after processing finishes.
  if(selectedPhoto!==photo||preview===file)return;
  const previewURL=URL.createObjectURL(preview);
  const preparedImage=new Image();preparedImage.src=previewURL;
  try{await preparedImage.decode()}catch(error){URL.revokeObjectURL(previewURL);return}
  if(selectedPhoto!==photo){URL.revokeObjectURL(previewURL);return}
  const originalURL=photo.url;
  photo.url=previewURL;
  attachmentImage.src=photo.url;
  if(originalURL!==photo.originalUrl)URL.revokeObjectURL(originalURL);
 }catch(error){/* Keep the original preview when compression is unsupported. */}
});

const feelingOptions=quickActions.querySelector('.iw-feeling-options');
// Touch uses native scrolling; mouse dragging uses a movement threshold to preserve clicks.
let feelingDrag=null,suppressFeelingClick=false;
feelingOptions.addEventListener('pointerdown',event=>{
 if(event.pointerType!=='mouse'||event.button!==0)return;
 suppressFeelingClick=false;
 feelingDrag={id:event.pointerId,x:event.clientX,scroll:feelingOptions.scrollLeft,active:false};
});
feelingOptions.addEventListener('pointermove',event=>{
 if(!feelingDrag||event.pointerId!==feelingDrag.id)return;
 const delta=event.clientX-feelingDrag.x;
 if(!feelingDrag.active&&Math.abs(delta)<5)return;
 if(!feelingDrag.active){
  feelingDrag.active=true;
  suppressFeelingClick=true;
  feelingOptions.setPointerCapture(event.pointerId);
  feelingOptions.classList.add('iw-dragging');
 }
 event.preventDefault();
 // Divide by the preview scale so dragging matches the distance on screen.
 const scale=phone.getBoundingClientRect().width/phone.offsetWidth;
 feelingOptions.scrollLeft=feelingDrag.scroll-delta/scale;
});
function finishFeelingDrag(event){
 if(!feelingDrag||event.pointerId!==feelingDrag.id)return;
 feelingDrag=null;
 feelingOptions.classList.remove('iw-dragging');
 if(feelingOptions.hasPointerCapture(event.pointerId))feelingOptions.releasePointerCapture(event.pointerId);
}
feelingOptions.addEventListener('pointerup',finishFeelingDrag);
feelingOptions.addEventListener('pointercancel',finishFeelingDrag);
feelingOptions.addEventListener('lostpointercapture',finishFeelingDrag);
feelingOptions.addEventListener('pointerleave',event=>{
 if(feelingDrag&&!feelingDrag.active)finishFeelingDrag(event);
});
feelingOptions.addEventListener('dragstart',event=>event.preventDefault());
feelingOptions.addEventListener('click',event=>{
 if(suppressFeelingClick&&event.detail!==0){event.preventDefault();event.stopImmediatePropagation();suppressFeelingClick=false}
},true);
feelingButton.setAttribute('aria-controls',feelingOptions.id);
feelingButton.setAttribute('aria-expanded','false');
function toggleFeelings(open){
 feelingButton.setAttribute('aria-expanded',String(open));
 feelingOptions.hidden=!open;
 postButton.hidden=open;
 if(open)feelingOptions.scrollLeft=0;
}
feelingButton.addEventListener('click',()=>toggleFeelings(feelingOptions.hidden));
feelingOptions.querySelectorAll('button').forEach(button=>{
 button.addEventListener('click',()=>{
  selectDraftChoice('feeling',button.querySelector('span').textContent.trim());
 });
});
document.addEventListener('pointerdown',event=>{
 if(!feelingOptions.hidden&&!quickActions.contains(event.target))toggleFeelings(false);
});
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'&&!feelingOptions.hidden){toggleFeelings(false);feelingButton.focus()}
});

})();
</script>

<script>
(()=>{
'use strict';
if(window.__inwardGlassPressInstalled)return;
window.__inwardGlassPressInstalled=true;
const held=new Map();
function resolve(node){
 const element=node instanceof Element?node:node?.parentElement;
 const control=element?.closest('#inward-preview button,.iw-photo-viewer-close,#breath-toggle');
 if(!control||control.disabled||control.getAttribute('aria-disabled')==='true')return null;
 return {control,surface:control.matches('[data-tab],[data-relax-mode]')?control.closest('.iw-glass-nav'):control};
}
function refresh(surface){surface.classList.toggle('iw-glass-pressed',Array.from(held.values()).some(record=>record.surface===surface))}
function begin(key,record){if(held.has(key))return;held.set(key,record);refresh(record.surface)}
function end(key){const record=held.get(key);if(!record)return;held.delete(key);refresh(record.surface)}
function releaseAll(){for(const key of Array.from(held.keys()))end(key)}
document.addEventListener('pointerdown',event=>{
 if(event.button>0)return;
 const target=resolve(event.target);if(!target)return;
 begin('pointer:'+event.pointerId,{...target,x:event.clientX,y:event.clientY});
},true);
for(const type of ['pointerup','pointercancel','lostpointercapture'])document.addEventListener(type,event=>end('pointer:'+event.pointerId),true);
document.addEventListener('pointermove',event=>{
 const key='pointer:'+event.pointerId,record=held.get(key);if(!record)return;
 // A horizontal drag or page scroll hands control back to its own gesture.
 if(Math.hypot(event.clientX-record.x,event.clientY-record.y)>9){end(key);return}
 const box=record.control.getBoundingClientRect();
 if(event.clientX<box.left||event.clientX>box.right||event.clientY<box.top||event.clientY>box.bottom)end(key);
},true);
document.addEventListener('keydown',event=>{
 if(event.repeat||![' ','Enter'].includes(event.key))return;
 const target=resolve(event.target);if(target)begin('key:'+event.key,target);
},true);
document.addEventListener('keyup',event=>end('key:'+event.key),true);
document.addEventListener('focusout',event=>{
 for(const [key,record] of held)if(key.startsWith('key:')&&record.control.contains(event.target)&&!record.control.contains(event.relatedTarget))end(key);
},true);
window.addEventListener('blur',releaseAll);
document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll()});
})();

<script>
(()=>{

const offset=n=>wrap(n+count/2)-count/2;
const nearest=index=>current+offset(index-current);
function paint(){
 cards.forEach((card,i)=>{const d=offset(i-current),dist=Math.abs(d),scale=1-.16*Math.min(dist,2),x=10+26*d*d,y=158+d*107;
 card.style.transform=dist>2.5?'translate3d(0,0,0) scale(.68)':`translate3d(${x+(1-entrance)*65}px,${y}px,0) scale(${scale*entrance})`;
 card.style.visibility=dist>2.5?'hidden':'visible';
 card.style.opacity=String(clamp(1-dist*.19,.3,1)*clamp((2.5-dist)/.65,0,1)*entrance);card.style.zIndex=String(10-Math.round(dist*2));});

}
function tick(now){
 const dt=Math.min((now-(last||now))/1000,.032);last=now;
 if(!drag){const acceleration=(target-current)*220-velocity*27;velocity+=acceleration*dt;current+=velocity*dt}

 paint();
 if(drag||Math.abs(target-current)>.001||Math.abs(velocity)>.01||entrance<1)raf=requestAnimationFrame(tick);
 else{current=target=wrap(target);velocity=0;raf=0;last=0;paint()}
}
function updateCardArt(){const center=wrap(Math.round(current));cards.forEach((card,i)=>{const item=items[i],url=!picker.hidden&&card.style.visibility!=='hidden'&&i===center?item.art:(item.still||item.art);const image=card.querySelector('img');if(image.getAttribute('src')!==url)image.src=url})}
reduced.addEventListener('change',updateCardArt);
function animate(){if(!raf){last=0;raf=requestAnimationFrame(tick)}}
async function choose(index){
 target=Math.round(index);selected=wrap(target);cards.forEach((c,i)=>c.setAttribute('aria-pressed',String(i===selected)));status.textContent=`${label}: ${items[selected].name}, ${selected+1} of ${items.length}`;animate();
 updateCardArt();onChoose(selected,status);
}

}

  meditationButton.setAttribute('aria-label',playing?'End meditation':'Start meditation');
  meditationButton.setAttribute('aria-pressed',String(playing));
