<svg id="iw-breathing" data-breathing-scene="true" width="288" height="416" viewBox="0 0 288 416" fill="none" xmlns="http://www.w3.org/2000/svg" role="group" aria-labelledby="breath-title breath-description">
<title id="breath-title">INWARD breathing</title>
<desc id="breath-description">Start to breathe in for five seconds, then breathe out for eight seconds. The animation repeats until End is pressed.</desc>
<style>
#iw-breathing{display:block;max-width:100%;height:auto;overflow:visible;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#iw-breathing .breath-control{cursor:pointer;outline:none}
#iw-breathing .breath-control:focus-visible rect{stroke:#805fe3;stroke-width:2}
#iw-breathing .breath-control:hover rect{fill:#eee6f9}
#iw-breathing .breath-control text{pointer-events:none;font-size:15px;font-weight:400;fill:#71627f;text-anchor:middle;dominant-baseline:middle}
</style>
